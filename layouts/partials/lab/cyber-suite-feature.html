{{ with site.Data.lab.cyber_suite }}
<section id="cyber-suite" class="lab-platform-feature" aria-labelledby="cyber-suite-title">
  <div class="lab-container lab-platform-feature-grid">
    <div>
      <p class="lab-kicker">Lab software platform</p>
      <h2 id="cyber-suite-title">{{ .title }}</h2>
      <p class="lab-platform-tagline">{{ .tagline }}</p>
      <p class="lab-platform-description">{{ .description }}</p>
      <div class="lab-actions"><a class="lab-button" href="{{ .page | relURL }}">Explore Cyber Suite <span aria-hidden="true">→</span></a><span class="lab-platform-status">{{ .status }}</span></div>
      <p class="lab-platform-availability">{{ .availability }}</p>
    </div>
    {{ partial "lab/cyber-suite-map.html" . }}
  </div>
</section>
{{ end }}

# .github/workflows/hugo.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read        # required by deploy-pages@v4

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.115.4   # keep or bump as needed
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Node.js dependencies
        run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          echo "Pages base_url: ${{ steps.pages.outputs.base_url }}"
          hugo version
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify build output
        run: |
          test -f public/index.html
          test -s public/index.html
          test -f public/CNAME
          echo "Build output OK"
          ls -la public | head -n 50

      # IMPORTANT: Use the latest Pages artifact action
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"

          max_attempts=12
          sleep_seconds=10
          max_time_seconds=20
          expected_http_code=200

          echo "Smoke test: wait for GitHub Pages to serve the deployed site"
          echo "URL: ${url}"
          echo "Policy: ${max_attempts} attempts, ${sleep_seconds}s between attempts (up to $((max_attempts * sleep_seconds))s total)"

          # Pages (and the CDN in front of it) can take a short moment to become available.
          # Follow redirects because `page_url` may redirect to the configured custom domain.
          attempt=1
          while [[ ${attempt} -le ${max_attempts} ]]; do
            code=$(curl -sSIL -o /dev/null -w "%{http_code}" -L --max-time "${max_time_seconds}" "${url}" || true)
            echo "Attempt ${attempt}/${max_attempts}: HTTP ${code}"

            if [[ "${code}" == "${expected_http_code}" ]]; then
              echo "Smoke test OK"
              exit 0
            fi

            attempt=$((attempt + 1))
            sleep "${sleep_seconds}"
          done

          echo "Smoke test failed: ${url} never returned HTTP ${expected_http_code}"
          exit 1

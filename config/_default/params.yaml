# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
 
appearance:
  theme_day: lab_brick
  theme_night: 
  font: native
  font_size: L

# SEO

marketing:
  seo:
    site_type: ResearchOrganization
    local_business_type: 'ProfessionalService'
    org_name: 'Cyberbotics Lab'
    description: 'Cyberbotics Lab at The Ohio State University studies control, planning, and learning for humanoid robots and exoskeletons.'
    twitter: 'CyberboticsL'
  analytics:
    google_analytics: 'G-6CVM5KTY4Q'
    baidu_tongji: ''
    google_tag_manager: ''
    microsoft_clarity: ''
  verification:
    google: ''
    baidu: ''

# Site header

header:
  navbar:
    enable: true
    align: r
    show_logo: true
    show_language: false
    show_day_night: false
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  block: lab
  copyright:
    notice: '© {year} Cyberbotics Lab. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    enable: true
    extra_languages:
      - python
      - latex
  math:
    enable: false # Opt in with `math: true` on pages that contain equations.
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/cyberboticslab/cyberboticslab.github.io'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: '' # No interactive map blocks; avoid loading Leaflet site-wide.
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    enable: false
    branch: main
    local_backend: false
  academicons:
    enable: true

# Citation style

publications:
  date_format: January 2006
  citation_style: APA
